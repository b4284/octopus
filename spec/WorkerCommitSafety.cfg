\* Worker-commit mode with epochs, markers, gap skips and lazy cursors: 1 source x 2 epochs x 2 seqs,
\* 2 dispatchers (adversarial: either acts on anything with stale memory), 1 worker. Expected: no violation.
CONSTANTS
    Sources = {s1}
    MaxSeq = 2
    Dispatchers = {d1, d2}
    Workers = {w1}
    MaxNet = 2
SPECIFICATION Spec
CONSTRAINT NetBound
INVARIANTS TypeOK Safety
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
