\* Worker-commit mode, exhaustive: 1 source x 2 epochs x 2 seq(s), dispatchers {d1}, workers {w1}. Expected: no violation.
CONSTANTS
    Sources = {s1}
    MaxSeq = 2
    Dispatchers = {d1}
    Workers = {w1}
    MaxNet = 2
SPECIFICATION Spec
CONSTRAINT NetBound
INVARIANTS TypeOK Safety
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
