\* The same with an ASYNC standby. Expected: a violation (acknowledged work lost or applied twice
\* after failover), which shows the invariants catch the failure measured in the drills.
CONSTANTS
    Sources = {s1}
    MaxSeq = 2
    Dispatchers = {d1}
    Workers = {w1}
    SyncReplica = FALSE
    MaxNet = 3
SPECIFICATION Spec
CONSTRAINT NetBound
INVARIANTS TypeOK Safety
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
