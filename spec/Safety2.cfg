\* Safety with two sources sharing dispatchers: 2 sources x 2 seqs, 2 dispatchers, 1 worker.
\* Expected: no violation.
CONSTANTS
    Sources = {s1, s2}
    MaxSeq = 2
    Dispatchers = {d1, d2}
    Workers = {w1}
    SyncReplica = TRUE
    MaxNet = 2
SPECIFICATION Spec
CONSTRAINT NetBound
INVARIANTS TypeOK Safety
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
