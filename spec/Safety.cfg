\* Safety under every failure, synchronous standby: 1 source x 3 seqs, 2 dispatchers, 2 workers.
\* Expected: no violation.
CONSTANTS
    Sources = {s1}
    MaxSeq = 3
    Dispatchers = {d1, d2}
    Workers = {w1, w2}
    SyncReplica = TRUE
    MaxNet = 2
SPECIFICATION Spec
CONSTRAINT NetBound
INVARIANTS TypeOK Safety
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
