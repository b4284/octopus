// Octopus wire protocol, v1. Carried over a pub/sub fabric (MQTT 5 first; Solace speaks MQTT natively).
//
// Topics ({ns} = namespace, default "octopus"; ids and group names must not contain '/', '+' or '#'):
//   {ns}/pub/{group}       producer -> any dispatcher (shared subscription "$share/octopusd/{ns}/pub/+"): PublishRequest
//   {ns}/any               worker -> any dispatcher (shared subscription): Envelope (results whose deliverer is gone)
//   {ns}/inbox/{id}        point-to-point: Envelope, to one dispatcher, worker or producer
//   {ns}/member/{member}   retained MemberInfo; replaced by a "gone" MemberInfo (empty inbox) by the member's last will
//   {ns}/owner/{group}     retained OwnerInfo: who serves the group now
//
// Batching: any number of messages for one destination may travel as one EnvelopeBatch (inboxes, {ns}/any) or one
// PublishBatch ({ns}/pub/...). Senders coalesce without timers: whatever queued while the previous send to that
// destination was in progress goes out together. Several workers or producers may share one connection and one
// inbox; per-item worker_id fields say whom an item is for.
//
// The fabric is never the durability point. Every acknowledgement that matters (PublishReply, ResultReply) is an
// application reply sent after the database commit, and every message is idempotent, so any of them may be lost,
// repeated or reordered and simply retried.
syntax = "proto3";
package octopus.v1;

// ---- publish ----

// What travels on {ns}/pub/...: one or more requests, possibly from different producers.
message PublishBatch {
  repeated PublishRequest requests = 1;
}

message PublishRequest {
  string reply_to = 1;            // inbox topic for the PublishReply
  uint64 request_id = 2;
  repeated PublishItem items = 3;
}

message PublishItem {
  string group = 1;
  string source = 2;
  int64 seq = 3;                  // gapless per source, from 1, stamped by the source
  bytes body = 4;
}

enum PublishStatus {
  PUBLISH_STATUS_UNSPECIFIED = 0;
  PUBLISH_STORED = 1;
  PUBLISH_DUPLICATE = 2;          // already stored or already applied: a retry
  PUBLISH_GROUP_MISMATCH = 3;     // the source belongs to another group: rejected
}

message PublishReply {
  uint64 request_id = 1;
  repeated PublishStatus status = 2;   // one per item, in order; empty when error is set
  string error = 3;                    // the request was not stored; retry
}

// ---- discovery (retained) ----

message MemberInfo {
  string member_id = 1;
  string inbox = 2;
  int64 started_us = 3;
}

message OwnerInfo {
  string group = 1;
  string member_id = 2;
  string inbox = 3;
  int64 epoch = 4;
}

// ---- work ----

// Worker -> dispatcher: permission to send `credit` more deliveries, for any of `groups` the dispatcher serves.
// The sum of a worker's outstanding credits never exceeds its free slots, so no event waits inside a busy worker.
// Every WorkResult also returns one credit to the dispatcher that receives it (the slot frees as the result goes
// out), so a busy worker needs no separate credit messages.
message WorkerCredit {
  string worker_id = 1;
  string inbox = 2;
  repeated string groups = 3;
  uint32 credit = 4;
  bool reset = 5;                 // the outstanding credit with this dispatcher is exactly `credit` (after a reconnect)
}

message Delivery {
  string group = 1;
  string source = 2;
  int64 seq = 3;                  // (source, seq) is the idempotency key for external side effects
  bytes body = 4;
  optional bytes context = 5;     // from the load hook
  int32 attempts = 6;             // failed attempts so far
  int64 enqueued_us = 7;
  string worker_id = 8;           // which worker on the receiving inbox this delivery is for
  // This event may have been handed out before without a result reaching Octopus (a timeout, or the group changed
  // owner): the worker may already have committed it. Workers check their idempotency key (source, seq) at least
  // for these. False means Octopus has never handed it out before.
  bool possibly_redelivered = 9;
}

message Deliver {
  string member_id = 1;           // send results here (its inbox), or to {ns}/any if it is gone
  string inbox = 2;
  repeated Delivery items = 3;
}

message WorkResult {
  uint64 request_id = 1;
  string group = 2;
  string source = 3;
  int64 seq = 4;
  bool ok = 5;
  bytes effect = 6;               // ok: passed to the apply hook in the commit transaction
  uint32 retry_delay_ms = 7;      // !ok: offer the event again after this delay
  string worker_id = 8;           // the worker this result is from (overrides ResultBatch.worker_id)
  // ok && done: the worker committed its own writes; the dispatcher removes the event (if still pending) so it is
  // never handed out again, and runs no apply hook. effect is ignored.
  bool done = 9;
}

message ResultBatch {
  string worker_id = 1;
  string reply_to = 2;
  repeated WorkResult items = 3;
}

enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  RESULT_APPLIED = 1;             // done: removed / commit: applied
  RESULT_DUPLICATE = 2;           // already removed or applied: a repeated delivery
  RESULT_GAP = 3;                 // an earlier event is not applied yet: nothing changed
  RESULT_FAILURE_RECORDED = 4;
  RESULT_ERROR = 5;               // the database call failed: nothing changed; the event comes back after the timeout
}

message ResultAck {
  uint64 request_id = 1;
  ResultStatus status = 2;
}

message ResultReply {
  repeated ResultAck items = 1;
}

// Dispatcher -> workers of a group: events are ready but this dispatcher holds no credit for them. A worker moves
// idle credits (granted to dispatchers that have nothing to hand out) here.
message Demand {
  string member_id = 1;
  string inbox = 2;
  string group = 3;
  uint32 ready = 4;
  repeated string worker_ids = 5;   // the workers on the receiving inbox this is for
}

// Dispatcher -> owning dispatcher: these groups have new events.
message Hint {
  repeated string groups = 1;
}

// Worker -> dispatcher: still working on these events (extends the delivery timeout).
message Progress {
  string worker_id = 1;
  repeated string sources = 2;
}

// Several envelopes for the same destination, sent as one message.
message EnvelopeBatch {
  repeated Envelope items = 1;
}

// Everything sent to an inbox or to {ns}/any.
message Envelope {
  oneof body {
    PublishReply publish_reply = 1;
    WorkerCredit credit = 2;
    Deliver deliver = 3;
    ResultBatch results = 4;
    ResultReply result_reply = 5;
    Hint hint = 6;
    Progress progress = 7;
    EnvelopeBatch batch = 8;
    Demand demand = 9;
  }
}
