[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/b4284/octopus"
rust-version = "1.88"

[workspace.dependencies]
octopus-core = { path = "crates/octopus-core" }
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
tracing = "0.1"
