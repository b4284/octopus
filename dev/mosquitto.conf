# Development broker for Octopus tests. Anonymous, no persistence: Octopus never relies on the fabric for
# durability (every acknowledgement is an application reply sent after the database commit).
listener 1883 127.0.0.1
allow_anonymous true
persistence false
max_inflight_messages 0
max_queued_messages 100000
max_packet_size 67108864
set_tcp_nodelay true
